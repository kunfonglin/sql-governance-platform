name: Reusable Deploy

on:
  workflow_call:
    inputs:
      project_id:
        description: 'Target GCP project ID'
        required: true
        type: string
      environment:
        description: 'GitHub environment name (e.g. test or production)'
        required: true
        type: string
      logical_project:
        description: 'Logical project name for manifest'
        required: false
        type: string
        default: 'unknown'
      bigquery_root:
        description: 'Root dir for bigquery/'
        required: false
        type: string
        default: 'bigquery'
      forbidden_project_ids:
        description: 'Space-separated own-env project ids to forbid in SQL (pre-deploy gate). Empty = skip.'
        required: false
        type: string
        default: ''
      manifest_dir:
        description: 'Directory for deploy manifests'
        required: false
        type: string
        default: 'audit/deploys'
      platform_ref:
        description: 'Ref of the platform repo to checkout'
        required: false
        type: string
        default: 'v1.5'
      migrations_root:
        description: 'Root dir for migrations/'
        required: false
        type: string
        default: 'migrations'
      ledger_dataset:
        description: 'Dataset where migrations_applied ledger lives'
        required: false
        type: string
        default: 'governance_audit'
      platform_repo:
        description: 'Owner/repo of the platform'
        required: false
        type: string
        default: ''
      pr_url:
        description: 'PR URL for manifest'
        required: false
        type: string
        default: ''
      runs_on:
        description: 'Runner label(s): ubuntu-latest (hosted) or self-hosted'
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      WIF_PROVIDER:
        required: true
      DEPLOY_SA:
        required: true
      TG_BOT_TOKEN:
        required: false
      TG_CHAT_ID:
        required: false
      PLATFORM_READ_TOKEN:
        required: false

jobs:
  deploy:
    runs-on: ${{ inputs.runs_on }}
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: write
    env:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
    steps:
      - name: Checkout project repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout platform repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.platform_repo }}
          ref: ${{ inputs.platform_ref }}
          path: .platform
          token: ${{ secrets.PLATFORM_READ_TOKEN || github.token }}

      - name: Project-id lint (gate BEFORE deploy)
        shell: bash
        run: |
          # 擋「硬寫自家 project id」——即使是直接 push（沒走 PR）也會在這裡被擋下、不會部署
          # v1.6：掃 bigquery_root（routines/tables/views）+ migrations/（migration 也要擋硬寫 id）
          for lint_root in "${{ inputs.bigquery_root }}" migrations; do
            python3 .platform/scripts/project-id-lint.py \
              "$lint_root" ${{ inputs.forbidden_project_ids }}
          done

      - name: Auth to GCP
        uses: ./.platform/.github/actions/auth-gcp
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOY_SA }}

      - name: Compute manifest path
        id: manifest
        shell: bash
        run: |
          DAY=$(date -u +%Y-%m-%d)
          PATH_OUT="${{ inputs.manifest_dir }}/${DAY}-${GITHUB_RUN_ID}-manifest.json"
          mkdir -p "${{ inputs.manifest_dir }}"
          echo "path=$PATH_OUT" >> "$GITHUB_OUTPUT"

      # v1.5：相依順序 = 表(migrations) → routines(SP/UDF) → views。
      # migrations 先跑把表建好，routines 的 CREATE OR REPLACE PROCEDURE 才能在 strict 驗證下
      # 引用到已存在的表（否則 SP 在表之前部署會 Not found）。
      - name: Apply migrations
        id: migrations
        uses: ./.platform/.github/actions/apply-migrations
        with:
          project_id: ${{ inputs.project_id }}
          migrations_root: ${{ inputs.migrations_root }}
          ledger_dataset: ${{ inputs.ledger_dataset }}

      - name: Deploy routines + write manifest
        uses: ./.platform/.github/actions/deploy-routines
        with:
          project_id: ${{ inputs.project_id }}
          bigquery_root: ${{ inputs.bigquery_root }}
          manifest_output: ${{ steps.manifest.outputs.path }}
          logical_project: ${{ inputs.logical_project }}
          platform_version: ${{ inputs.platform_ref }}
          pr_url: ${{ inputs.pr_url }}
          approved_by: ${{ github.actor }}

      # View 走 state-based（CREATE OR REPLACE VIEW，非破壞）。
      # 放在 migrations 之後：view 引用的 table 由 migration 先建好，dry-run/部署才不會因缺 table 失敗。
      - name: Deploy views
        id: views
        uses: ./.platform/.github/actions/deploy-views
        with:
          project_id: ${{ inputs.project_id }}
          bigquery_root: ${{ inputs.bigquery_root }}

      - name: Patch manifest with migrations_applied + views
        if: success()
        shell: bash
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.path }}
          APPLIED_JSON: ${{ steps.migrations.outputs.applied_json }}
          VIEWS_JSON: ${{ steps.views.outputs.deployed_json }}
        run: |
          if [[ ! -f "$MANIFEST_PATH" ]]; then
            echo "Manifest not found at $MANIFEST_PATH, skipping patch"
            exit 0
          fi
          # 用 python 把 deployed.migrations_applied / deployed.views 改成真實值
          python3 - <<'PY'
          import json, os
          path = os.environ['MANIFEST_PATH']
          applied = json.loads(os.environ.get('APPLIED_JSON','[]') or '[]')
          views = json.loads(os.environ.get('VIEWS_JSON','[]') or '[]')
          with open(path) as f:
              m = json.load(f)
          deployed = m.setdefault('deployed', {})
          deployed['migrations_applied'] = applied
          deployed['views'] = views
          with open(path, 'w') as f:
              json.dump(m, f, indent=2)
          print(f"Patched manifest: {len(applied)} migrations_applied, {len(views)} views")
          PY

      - name: Commit manifest
        uses: ./.platform/.github/actions/write-manifest
        with:
          manifest_path: ${{ steps.manifest.outputs.path }}
          commit_message: "chore(deploy): ${{ inputs.logical_project }} → ${{ inputs.project_id }} (${{ github.sha }})"

      - name: Notify TG (success)
        if: success() && env.TG_BOT_TOKEN != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        uses: ./.platform/.github/actions/notify-tg
        with:
          bot_token: ${{ secrets.TG_BOT_TOKEN }}
          chat_id: ${{ secrets.TG_CHAT_ID }}
          message: |
            ✅ Deploy success
            project: ${{ inputs.logical_project }}
            target : ${{ inputs.project_id }}
            env    : ${{ inputs.environment }}
            sha    : ${{ github.sha }}
            run    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notify TG (failure)
        if: failure() && env.TG_BOT_TOKEN != ''
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        uses: ./.platform/.github/actions/notify-tg
        with:
          bot_token: ${{ secrets.TG_BOT_TOKEN }}
          chat_id: ${{ secrets.TG_CHAT_ID }}
          message: |
            ❌ Deploy FAILED
            project: ${{ inputs.logical_project }}
            target : ${{ inputs.project_id }}
            env    : ${{ inputs.environment }}
            run    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
